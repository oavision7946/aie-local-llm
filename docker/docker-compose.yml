# Engine profiles. Every port is published on 127.0.0.1 only: Compose creates its own network,
# where a mapping without a host address would publish on all interfaces.
# Containers run as UID:GID (default 1000:1000) so files written to the Hugging Face cache stay
# owned by you; pass your IDs with: UID=$(id -u) GID=$(id -g) docker compose --profile vllm up
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34}
    profiles: ["vllm"]
    command: ["${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}", "--dtype", "bfloat16", "--max-model-len", "${VLLM_MAX_MODEL_LEN:-4096}", "--gpu-memory-utilization", "${VLLM_GPU_MEMORY_UTILIZATION:-0.4}"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HF_TOKEN
      - HOME=/tmp
      - USER=${USER:-user}
      - HF_HOME=/hf-cache
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - "${HOME}/.cache/huggingface:/hf-cache"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  vllm-lmcache:
    image: ${VLLM_LMCACHE_IMAGE:-vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34}  # includes LMCache
    profiles: ["vllm-lmcache"]
    entrypoint: ["vllm"]
    command:
      - "serve"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-4096}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.4}"
      - "--kv-transfer-config"
      - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HF_TOKEN
      - HOME=/tmp
      - USER=${USER:-user}
      - HF_HOME=/hf-cache
      - LMCACHE_CHUNK_SIZE=256
      - LMCACHE_LOCAL_CPU=True
      - LMCACHE_MAX_LOCAL_CPU_SIZE=${LMCACHE_MAX_LOCAL_CPU_SIZE:-20}
    ports:
      - "127.0.0.1:${VLLM_LMCACHE_PORT:-8001}:8000"
    volumes:
      - "${HOME}/.cache/huggingface:/hf-cache"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.23@sha256:f832b5c39559c9caa900b22ad37c76fcce66470676855c42052102c537812f1f}
    profiles: ["sglang"]
    command:
      - "python3"
      - "-m"
      - "sglang.launch_server"
      - "--model-path"
      - "${SGLANG_MODEL:-Qwen/Qwen2.5-3B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--dtype"
      - "bfloat16"
      - "--context-length"
      - "${SGLANG_CONTEXT_LENGTH:-4096}"
      - "--attention-backend"
      - "flashinfer"
      - "--mem-fraction-static"
      - "${SGLANG_MEM_FRACTION_STATIC:-0.4}"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HF_TOKEN
      - HOME=/tmp
      - USER=${USER:-user}
      - HF_HOME=/hf-cache
    ports:
      - "127.0.0.1:${SGLANG_PORT:-30000}:30000"
    volumes:
      - "${HOME}/.cache/huggingface:/hf-cache"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
