[project]
name = "aie-local-llm"
version = "0.1.0"
description = "OpenAI-compatible local-model QA/RAG gateway running vLLM/SGLang/LMCache on DGX Spark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openai>=1.50",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() is designed to be used as a default argument value.
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# ui/ is a Streamlit script relying on sibling-module imports resolved by Streamlit's own
# sys.path handling at runtime, not a package; its module name would collide with app/ under mypy.
exclude = ["^\\.venv/", "^\\.internal/", "^ui/"]

[[tool.mypy.overrides]]
# Third-party stubs aren't available for these; type-check the rest of the project strictly.
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.uv]
torch-backend = "auto"
