[project]
name = "aie-local-llm"
version = "0.1.0"
description = "OpenAI-compatible local-model QA/RAG gateway running vLLM/SGLang/LMCache on DGX Spark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openai>=1.50",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() is designed to be used as a default argument value.
ignore = ["B008"]

[tool.uv]
torch-backend = "auto"
